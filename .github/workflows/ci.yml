name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 시험
        env:
          DT2_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/run-tests.sh
